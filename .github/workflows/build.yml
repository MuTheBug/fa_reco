name: build

on:
  push:
    branches: ["main", "master", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release v<hadir.__version__> with the installer"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            tests/.cache
          key: models-${{ hashFiles('hadir/face/models.py') }}
      - run: pip install -r requirements-dev.txt
      - run: python tools/fetch_models.py
      - run: python -m pyflakes hadir tools tests packaging/launcher.py packaging/update_files.py packaging/install_check.py
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      update_from: ${{ steps.update.outputs.from }}
      update_from_text: ${{ steps.update.outputs.from_text }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # exactly the Python of the published builds, so that their libraries stay byte for byte
          # the same and an update file carries only what really changed
          python-version: "3.13.16"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/cache@v4
        with:
          path: models/*.onnx
          key: models-${{ hashFiles('hadir/face/models.py') }}
      - run: pip install -r requirements.txt pyinstaller==6.22.3
      - run: python tools/fetch_models.py
      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = python -c "import hadir; print(hadir.__version__)"
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "tag $env:GITHUB_REF_NAME does not match hadir.__version__ $v"
          }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Build with PyInstaller
        run: pyinstaller packaging/hadir.spec --noconfirm
      - name: Self-test of the packaged program
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/serengil/deepface/master/tests/unit/dataset/img1.jpg" -OutFile face.jpg
          $p = Start-Process -FilePath "dist\Hadir\Hadir.exe" -ArgumentList "--selftest","--selftest-image","face.jpg","--selftest-out","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - name: File list of this version
        run: python packaging/update_files.py manifest dist/Hadir ${{ env.APP_VERSION }}
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $iscc "/DAppVersion=$env:APP_VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Update file (only the files that changed since the earlier releases)
        id: update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python packaging/update_files.py bases $env:GITHUB_REPOSITORY $env:APP_VERSION build\bases
          if ($LASTEXITCODE -ne 0) { throw "could not read the earlier releases" }
          python packaging/update_files.py plan dist\Hadir build\bases build\update
          if ($LASTEXITCODE -ne 0) { throw "could not prepare the update" }
          if (Test-Path build\update\info.iss) {
            & $env:ISCC "/DAppVersion=$env:APP_VERSION" packaging\update.iss
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          }
          Get-ChildItem dist\Hadir*.exe | Format-Table Name, Length
      - name: Install, update and remove on this runner
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_FROM: ${{ steps.update.outputs.from }}
        run: |
          $testArgs = @("--setup", "dist\HadirSetup-$env:APP_VERSION.exe", "--manifest", "dist\Hadir\hadir-files.txt", "--face", "face.jpg")
          if ($env:UPDATE_FROM) {
            $previous = ($env:UPDATE_FROM -split ", ")[0]
            gh release download "v$previous" --repo $env:GITHUB_REPOSITORY --pattern "HadirSetup-$previous.exe" --dir previous
            if ($LASTEXITCODE -ne 0) { throw "could not download HadirSetup-$previous.exe" }
            $testArgs += @("--update", "dist\HadirUpdate-$env:APP_VERSION.exe", "--check", "build\update\check.txt",
                           "--previous", "previous\HadirSetup-$previous.exe")
          }
          python packaging/install_check.py @testArgs
          if ($LASTEXITCODE -ne 0) { throw "install test failed" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: install-logs
          path: install-logs/
          if-no-files-found: ignore
      - name: Portable zip
        shell: pwsh
        run: |
          "Data is stored in the data folder next to Hadir.exe" | Out-File -FilePath dist\Hadir\portable.txt -Encoding utf8
          Compress-Archive -Path dist\Hadir -DestinationPath "dist\Hadir-Portable-$env:APP_VERSION.zip"
          Copy-Item dist\Hadir\hadir-files.txt "dist\Hadir-files-$env:APP_VERSION.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Hadir-Setup-${{ env.APP_VERSION }}
          path: dist/HadirSetup-*.exe
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Hadir-Update-${{ env.APP_VERSION }}
          path: dist/HadirUpdate-*.exe
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Hadir-Portable-${{ env.APP_VERSION }}
          path: dist/Hadir-Portable-*.zip
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Hadir-files-${{ env.APP_VERSION }}
          path: dist/Hadir-files-*.txt

  release:
    # a pushed v* tag, or "Run workflow" with "release" ticked (the tag is then created here)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: Hadir-*
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.windows.outputs.version }}
          UPDATE_FROM: ${{ needs.windows.outputs.update_from_text }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::release $tag already exists; raise hadir.__version__ to publish a new one"
            exit 1
          fi
          setup="out/HadirSetup-$VERSION.exe"
          update="out/HadirUpdate-$VERSION.exe"
          test -f "$setup"
          test -f "out/Hadir-Portable-$VERSION.zip"
          test -f "out/Hadir-files-$VERSION.txt"
          (cd out && sha256sum -- * > SHA256SUMS.txt)
          ls -l out
          mb() { echo $(( ($(stat -c %s "$1") + 524288) / 1048576 )); }
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          sed -e "s|@VERSION@|$VERSION|g" -e "s|@SETUP_MB@|$(mb "$setup")|g" -e "s|@SETUP_SHA256@|$(sha "$setup")|g" \
            packaging/release-notes.md > notes.md
          if [ -f "$update" ]; then
            sed -i -e "s|@UPDATE_FROM@|$UPDATE_FROM|g" -e "s|@UPDATE_MB@|$(mb "$update")|g" \
              -e "s|@UPDATE_SHA256@|$(sha "$update")|g" -e 's| *<!--update-->||' notes.md
          else
            sed -i '/<!--update-->/d' notes.md
          fi
          { echo; echo '```'; cat out/SHA256SUMS.txt; echo '```'; } >> notes.md
          gh release create "$tag" out/* --title "حاضر $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
