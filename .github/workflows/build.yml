name: build

on:
  push:
    branches: ["main", "master", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            tests/.cache
          key: models-${{ hashFiles('hadir/face/models.py') }}
      - run: pip install -r requirements-dev.txt
      - run: python tools/fetch_models.py
      - run: python -m pyflakes hadir tools tests packaging/launcher.py
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/cache@v4
        with:
          path: models/*.onnx
          key: models-${{ hashFiles('hadir/face/models.py') }}
      - run: pip install -r requirements.txt pyinstaller==6.22.3
      - run: python tools/fetch_models.py
      - name: Version
        shell: pwsh
        run: |
          $v = python -c "import hadir; print(hadir.__version__)"
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build with PyInstaller
        run: pyinstaller packaging/hadir.spec --noconfirm
      - name: Self-test of the packaged program
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/serengil/deepface/master/tests/unit/dataset/img1.jpg" -OutFile face.jpg
          $p = Start-Process -FilePath "dist\Hadir\Hadir.exe" -ArgumentList "--selftest","--selftest-image","face.jpg","--selftest-out","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:APP_VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Portable zip
        shell: pwsh
        run: |
          "Data is stored in the data folder next to Hadir.exe" | Out-File -FilePath dist\Hadir\portable.txt -Encoding utf8
          Compress-Archive -Path dist\Hadir -DestinationPath "dist\Hadir-Portable-$env:APP_VERSION.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Hadir-Setup-${{ env.APP_VERSION }}
          path: dist/HadirSetup-*.exe
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Hadir-Portable-${{ env.APP_VERSION }}
          path: dist/Hadir-Portable-*.zip
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
